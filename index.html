<!DOCTYPE html>
<html lang="en">

<head>
    <title>GEC Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>GEC Store</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#products">Products</a>
            <a href="#about">About</a>
        </nav>
    </header>


    <main>

        <section class="hero">
            <h2>Welcome to GEC Store</h2>

            <p>
                Find useful products for your college life.
            </p>
        </section>


        <section id="products">

            <h2>Products</h2>

            <div class="search-area">

                <input
                    type="text"
                    id="searchBox"
                    placeholder="Search products..."
                >

            </div>


            <div id="productContainer" class="product-container">

                <!-- Products will be added here using JavaScript -->

            </div>

        </section>


        <section id="about" class="about">

            <h2>About GEC Store</h2>

            <p>
                GEC Store is a simple e-commerce application.
                
            </p>

        </section>

    </main>


    <footer>

        <p>
            © 2026 GEC Store
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
